<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Super Fun Pit Stop Racers!</title>
<style>
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  body {
    margin: 0;
    padding: 0;
    background: #4CAF50;
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100vh;
    touch-action: none;
  }

  /* Top Banner */
  #header {
    background: #FFD54F;
    width: 100%;
    padding: 10px 20px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    border-bottom: 6px solid #FFA000;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    z-index: 10;
  }
  .header-stat {
    font-size: 22px;
    font-weight: bold;
    color: #37474F;
  }

  #pause-btn {
    background: #7E57C2;
    color: white;
    font-size: 18px;
    font-weight: bold;
    padding: 8px 16px;
    border: 3px solid white;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 4px 0 #512DA8;
    touch-action: manipulation;
  }
  #pause-btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #512DA8;
  }

  /* Game Canvas Track */
  #game-container {
    position: relative;
    width: 100%;
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  canvas {
    background: #81C784;
    border-radius: 24px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    max-width: 95vw;
    max-height: 80vh;
  }

  /* Control Panel in Bottom-Left Corner */
  #control-panel {
    position: absolute;
    bottom: 20px;
    left: 20px;
    display: flex;
    align-items: flex-end;
    gap: 15px;
    z-index: 5;
  }

  .control-btn {
    border: 5px solid white;
    cursor: pointer;
    box-shadow: 0 8px 0 rgba(0,0,0,0.3), 0 12px 20px rgba(0,0,0,0.3);
    transition: transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 900;
    touch-action: manipulation;
  }
  .control-btn:active {
    transform: translateY(6px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.3);
  }

  #steering-wheel {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: #424242;
    border-color: #212121;
    font-size: 40px;
    box-shadow: 0 8px 0 #212121, 0 12px 20px rgba(0,0,0,0.3);
  }

  #pedals {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .pedal {
    width: 60px;
    height: 90px;
    border-radius: 10px;
    font-size: 24px;
  }

  #gas-pedal {
    background: #4CAF50;
    border-color: #388E3C;
    box-shadow: 0 8px 0 #388E3C, 0 12px 20px rgba(0,0,0,0.3);
  }
  #brake-pedal {
    background: #F44336;
    border-color: #D32F2F;
    box-shadow: 0 8px 0 #D32F2F, 0 12px 20px rgba(0,0,0,0.3);
  }

  /* Call to Pit Stop Button */
  #pit-call-btn {
    position: absolute;
    bottom: 25px;
    right: 35px;
    background: #FF5722;
    color: white;
    font-size: 26px;
    font-weight: 900;
    padding: 16px 28px;
    border: 5px solid white;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 0 #D84315, 0 12px 20px rgba(0,0,0,0.3);
    transition: transform 0.1s;
    animation: bounce 1.8s infinite;
    z-index: 5;
    touch-action: manipulation;
  }
  #pit-call-btn:active {
    transform: translateY(6px);
    box-shadow: 0 2px 0 #D84315;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  /* Pause Screen Overlay */
  #pause-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(5px);
    z-index: 120;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }
  #pause-box {
    background: #FFF;
    border: 8px solid #7E57C2;
    border-radius: 30px;
    padding: 30px 40px;
    text-align: center;
    box-shadow: 0 16px 40px rgba(0,0,0,0.5);
  }
  #pause-box h2 {
    font-size: 36px;
    color: #512DA8;
    margin: 0 0 10px 0;
  }
  #resume-btn {
    background: #4CAF50;
    color: white;
    font-size: 26px;
    font-weight: 900;
    border: 5px solid white;
    border-radius: 40px;
    padding: 12px 36px;
    cursor: pointer;
    box-shadow: 0 6px 0 #2E7D32;
    margin-top: 15px;
    touch-action: manipulation;
  }
  #resume-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #2E7D32;
  }

  /* Pit Stop Modal Overlay */
  #pit-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    z-index: 100;
    justify-content: center;
    align-items: center;
  }
  #pit-garage {
    background: #FFF9C4;
    border: 8px solid #FF9800;
    border-radius: 36px;
    width: 90%;
    max-width: 820px;
    padding: 24px;
    text-align: center;
    box-shadow: 0 16px 40px rgba(0,0,0,0.4);
    position: relative;
  }
  #pit-garage h2 {
    font-size: 34px;
    margin: 0 0 10px 0;
    color: #E65100;
  }

  #garage-stage {
    display: flex;
    justify-content: space-around;
    align-items: center;
    margin: 15px 0;
  }
  #car-preview {
    width: 220px;
    height: 110px;
    position: relative;
    border-radius: 20px;
    background: #E53935;
    border: 6px solid #B71C1C;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 8px 16px rgba(0,0,0,0.2);
  }
  .car-window {
    width: 70px;
    height: 45px;
    background: #81D4FA;
    border-radius: 12px;
    border: 4px solid #0288D1;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 20px;
  }
  .car-tire-preview {
    position: absolute;
    width: 32px;
    height: 16px;
    background: #212121;
    border-radius: 4px;
    border: 2px solid #616161;
  }
  .tire-fl { top: -14px; left: 24px; }
  .tire-fr { bottom: -14px; left: 24px; }
  .tire-rl { top: -14px; right: 24px; }
  .tire-rr { bottom: -14px; right: 24px; }

  .tools-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    margin: 20px 0;
  }
  .pit-tool-btn {
    background: #FFFFFF;
    border: 4px solid #42A5F5;
    border-radius: 20px;
    padding: 14px;
    font-size: 20px;
    font-weight: bold;
    color: #1565C0;
    cursor: pointer;
    box-shadow: 0 6px 0 #1E88E5;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    transition: all 0.1s;
    touch-action: manipulation;
  }
  .pit-tool-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #1E88E5;
  }
  .pit-tool-btn.done {
    background: #C8E6C9;
    border-color: #4CAF50;
    color: #2E7D32;
    box-shadow: 0 6px 0 #388E3C;
  }

  #go-race-btn {
    background: #4CAF50;
    color: white;
    font-size: 28px;
    font-weight: 900;
    border: 5px solid white;
    border-radius: 40px;
    padding: 14px 40px;
    cursor: pointer;
    box-shadow: 0 8px 0 #2E7D32, 0 10px 20px rgba(0,0,0,0.2);
    margin-top: 10px;
    display: inline-block;
    touch-action: manipulation;
  }
  #go-race-btn:active {
    transform: translateY(4px);
    box-shadow: 0 4px 0 #2E7D32;
  }

  .bubble-fx {
    position: absolute;
    pointer-events: none;
    font-size: 32px;
    animation: floatUp 0.8s forwards ease-out;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: scale(0.6) translateY(0); }
    100% { opacity: 0; transform: scale(1.4) translateY(-80px); }
  }
</style>
</head>
<body>

  <!-- Top Info -->
  <div id="header">
    <div class="header-stat">🏁 Lap: <span id="lap-counter">1</span></div>
    <div class="header-stat">⛽ Gas: <span id="gas-display">100%</span></div>
    <div class="header-stat">🛞 Tires: <span id="tire-display">Fresh</span></div>
    <button id="pause-btn" onclick="togglePause()">⏸️ Pause & Save</button>
  </div>

  <!-- Race Track View -->
  <div id="game-container">
    <canvas id="trackCanvas" width="900" height="540"></canvas>
    
    <!-- Control Panel -->
    <div id="control-panel">
        <button id="steering-wheel" class="control-btn" onclick="playHonk()">📢</button>
        <div id="pedals">
            <button id="gas-pedal" class="pedal control-btn" onclick="speedUp()">💨</button>
            <button id="brake-pedal" class="pedal control-btn" onclick="slowDown()">🛑</button>
        </div>
    </div>

    <button id="pit-call-btn" onclick="openPitStop()">🔧 PIT STOP NOW!</button>
  </div>

  <!-- Pause Overlay -->
  <div id="pause-overlay">
    <div id="pause-box">
      <h2>⏸️ GAME PAUSED</h2>
      <p style="font-size: 18px; color: #555;">Game progress has been saved automatically!</p>
      <button id="resume-btn" onclick="togglePause()">▶️ RESUME RACE</button>
    </div>
  </div>

  <!-- Pit Stop Workshop Overlay -->
  <div id="pit-overlay">
    <div id="pit-garage">
      <h2>🛠️ PIT CREW WORKSHOP 🛠️</h2>
      <p style="font-size: 18px; margin: 0 0 12px 0; color: #555;">Tap everything to tune up your race car!</p>

      <div id="garage-stage">
        <div id="car-preview">
          <div class="car-tire-preview tire-fl" id="prev-t1"></div>
          <div class="car-tire-preview tire-fr" id="prev-t2"></div>
          <div class="car-tire-preview tire-rl" id="prev-t3"></div>
          <div class="car-tire-preview tire-rr" id="prev-t4"></div>
          <div class="car-window" id="car-windshield">👀</div>
        </div>
      </div>

      <div class="tools-grid">
        <button class="pit-tool-btn" id="btn-fuel" onclick="pitAction('fuel', this)">
          <span>⛽</span> Fill Up Gas Tank!
        </button>
        <button class="pit-tool-btn" id="btn-tire" onclick="pitAction('tire', this)">
          <span>🛞</span> Put On Mega Tires!
        </button>
        <button class="pit-tool-btn" id="btn-wash" onclick="pitAction('wash', this)">
          <span>🧼</span> Wash Windshield Clean!
        </button>
        <button class="pit-tool-btn" id="btn-color" onclick="pitAction('color', this)">
          <span>🎨</span> Paint Car New Color!
        </button>
      </div>

      <button id="go-race-btn" onclick="leavePitStop()">🏎️ GO BACK TO RACE!</button>
    </div>
  </div>

<script>
  // Prevent double-tap zoom gestures globally
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      e.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });

  // Prevent multi-touch gesture zooms (pinch-to-zoom)
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('gesturechange', (e) => e.preventDefault());

  // Web Audio Synthesizer
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playBeep(freq, type = 'sine', duration = 0.15) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  function playHonk() {
    playBeep(440, 'triangle', 0.2);
    setTimeout(() => playBeep(554, 'triangle', 0.25), 100);
  }

  // Track & State Setup
  const canvas = document.getElementById('trackCanvas');
  const ctx = canvas.getContext('2d');

  let currentLap = 1;
  let carGas = 100;
  let tireStatus = 'Fresh';
  let isPitOpen = false;
  let isPaused = false;

  const colors = ['#E53935', '#1E88E5', '#FDD835', '#8E24AA', '#43A047', '#FB8C00'];
  let carColorIdx = 0;

  const cars = [
    { name: 'Player', progress: 0, speed: 0.0035, baseSpeed: 0.0035, color: colors[0], lane: 0, isPlayer: true },
    { name: 'Bluey', progress: 0.35, speed: 0.0031, baseSpeed: 0.0031, color: '#00ACC1', lane: -28, isPlayer: false },
    { name: 'Speedy', progress: 0.7, speed: 0.0033, baseSpeed: 0.0033, color: '#FB8C00', lane: 28, isPlayer: false }
  ];

  // Local Storage Save / Load
  function saveGameState() {
    const gameState = {
      currentLap,
      carGas,
      tireStatus,
      carColorIdx,
      cars: cars.map(c => ({ progress: c.progress, speed: c.speed, color: c.color }))
    };
    try {
      localStorage.setItem('pitstop_game_save', JSON.stringify(gameState));
    } catch (e) {
      console.warn('Unable to save to localStorage', e);
    }
  }

  function loadGameState() {
    try {
      const saved = localStorage.getItem('pitstop_game_save');
      if (saved) {
        const data = JSON.parse(saved);
        currentLap = data.currentLap ?? 1;
        carGas = data.carGas ?? 100;
        tireStatus = data.tireStatus ?? 'Fresh';
        carColorIdx = data.carColorIdx ?? 0;

        if (data.cars && data.cars.length === cars.length) {
          data.cars.forEach((savedCar, i) => {
            cars[i].progress = savedCar.progress;
            cars[i].speed = savedCar.speed;
            cars[i].color = savedCar.color;
          });
        }
        updateUI();
      }
    } catch (e) {
      console.warn('Unable to load from localStorage', e);
    }
  }

  function updateUI() {
    document.getElementById('lap-counter').innerText = currentLap;
    document.getElementById('gas-display').innerText = carGas + '%' + (carGas <= 25 ? ' (Low!)' : '');
    document.getElementById('tire-display').innerText = tireStatus;
  }

  // Track path calculation
  function getTrackPos(progress, offsetRadius = 0) {
    const rx = 340 + offsetRadius;
    const ry = 180 + offsetRadius;
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const angle = progress * Math.PI * 2;
    return {
      x: cx + Math.cos(angle) * rx,
      y: cy + Math.sin(angle) * ry,
      angle: angle + Math.PI / 2
    };
  }

  function drawTrack() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    ctx.beginPath();
    ctx.ellipse(cx, cy, 390, 230, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#424242';
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(cx, cy, 290, 130, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#66BB6A';
    ctx.fill();

    ctx.lineWidth = 8;
    ctx.strokeStyle = '#FFFFFF';
    ctx.setLineDash([20, 20]);
    ctx.beginPath();
    ctx.ellipse(cx, cy, 340, 180, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#FFF';
    ctx.fillRect(cx - 6, cy - 230, 12, 100);
    ctx.fillStyle = '#000';
    for (let y = cy - 230; y < cy - 130; y += 20) {
      ctx.fillRect(cx - 6, y, 6, 10);
      ctx.fillRect(cx, y + 10, 6, 10);
    }
  }

  function drawCar(car) {
    const pos = getTrackPos(car.progress, car.lane);
    ctx.save();
    ctx.translate(pos.x, pos.y);
    ctx.rotate(pos.angle);

    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fillRect(-16, -10, 36, 24);

    ctx.fillStyle = '#111';
    ctx.fillRect(-14, -14, 10, 5);
    ctx.fillRect(8, -14, 10, 5);
    ctx.fillRect(-14, 9, 10, 5);
    ctx.fillRect(8, 9, 10, 5);

    ctx.fillStyle = car.color;
    ctx.beginPath();
    ctx.roundRect(-16, -11, 36, 22, 6);
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#222';
    ctx.stroke();

    ctx.fillStyle = '#E0F7FA';
    ctx.fillRect(-2, -7, 10, 14);

    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(car.isPlayer ? '⭐' : '🏎️', 12, 4);

    ctx.restore();
  }

  function gameLoop() {
    if (!isPitOpen && !isPaused) {
      drawTrack();

      cars.forEach(car => {
        car.progress += car.speed;

        if (car.speed > car.baseSpeed) {
          car.speed -= 0.00001;
        } else if (car.speed < car.baseSpeed) {
          car.speed += 0.00001;
        }

        if (car.progress >= 1) {
          car.progress = 0;
          if (car.isPlayer) {
            currentLap++;
            carGas = Math.max(10, carGas - 15);
            updateUI();
            saveGameState();
          }
        }
        drawCar(car);
      });
    }
    requestAnimationFrame(gameLoop);
  }

  function togglePause() {
    isPaused = !isPaused;
    const overlay = document.getElementById('pause-overlay');
    const pauseBtn = document.getElementById('pause-btn');

    if (isPaused) {
      saveGameState();
      overlay.style.display = 'flex';
      pauseBtn.innerText = '▶️ Resume';
      playBeep(300, 'triangle', 0.2);
    } else {
      overlay.style.display = 'none';
      pauseBtn.innerText = '⏸️ Pause & Save';
      playBeep(600, 'sine', 0.15);
    }
  }

  function speedUp() {
    if (!isPitOpen && !isPaused) {
      cars[0].speed = cars[0].baseSpeed * 2;
      playBeep(880, 'square', 0.1);
    }
  }

  function slowDown() {
    if (!isPitOpen && !isPaused) {
      cars[0].speed = cars[0].baseSpeed * 0.5;
      playBeep(220, 'triangle', 0.1);
    }
  }

  function openPitStop() {
    if (isPaused) return;
    isPitOpen = true;
    playHonk();
    document.getElementById('pit-overlay').style.display = 'flex';
    document.getElementById('car-preview').style.background = cars[0].color;
  }

  function leavePitStop() {
    playBeep(600, 'sine', 0.1);
    setTimeout(() => playBeep(800, 'sine', 0.2), 120);
    isPitOpen = false;
    document.getElementById('pit-overlay').style.display = 'none';
    document.querySelectorAll('.pit-tool-btn').forEach(btn => btn.classList.remove('done'));
    saveGameState();
  }

  function pitAction(type, btn) {
    btn.classList.add('done');
    createPopEffect(btn);

    if (type === 'fuel') {
      carGas = 100;
      updateUI();
      playBeep(523, 'triangle', 0.25);
    } else if (type === 'tire') {
      tireStatus = 'Super Fast!';
      updateUI();
      playBeep(330, 'square', 0.15);
      const tires = document.querySelectorAll('.car-tire-preview');
      tires.forEach(t => t.style.background = '#FF9800');
      setTimeout(() => tires.forEach(t => t.style.background = '#212121'), 400);
    } else if (type === 'wash') {
      playBeep(659, 'sine', 0.2);
      const glass = document.getElementById('car-windshield');
      glass.innerText = '✨😎✨';
      setTimeout(() => glass.innerText = '👀', 1200);
    } else if (type === 'color') {
      playBeep(440, 'triangle', 0.15);
      carColorIdx = (carColorIdx + 1) % colors.length;
      cars[0].color = colors[carColorIdx];
      document.getElementById('car-preview').style.background = colors[carColorIdx];
    }
    saveGameState();
  }

  function createPopEffect(element) {
    const fx = document.createElement('div');
    fx.className = 'bubble-fx';
    fx.innerText = ['⭐', '🎉', '💨', '🔧', '💥'][Math.floor(Math.random() * 5)];
    const rect = element.getBoundingClientRect();
    fx.style.left = (rect.left + rect.width / 2 - 15) + 'px';
    fx.style.top = (rect.top + 10) + 'px';
    document.body.appendChild(fx);
    setTimeout(() => fx.remove(), 800);
  }

  // Initialize and load any saved session
  loadGameState();
  requestAnimationFrame(gameLoop);
</script>
</body>
</html>
